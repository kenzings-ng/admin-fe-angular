<app-auth-layout title="Sign in" subtitle="Sign in to manage your store">
  <form
    (submit)="$event.preventDefault(); submit()"
    class="rounded-sm border border-slate-300 bg-white p-6 sm:p-8"
    novalidate
  >
    <div class="mb-5">
      <label
        for="email"
        class="mb-1.5 block text-sm font-medium text-slate-700"
      >
        Email
      </label>
      <input
        id="email"
        type="email"
        [formField]="loginForm.email"
        autocomplete="email"
        [attr.aria-invalid]="isInvalid(loginForm.email())"
        [attr.aria-describedby]="
          isInvalid(loginForm.email()) ? 'email-error' : null
        "
        class="min-h-11 w-full rounded-sm border border-slate-400 bg-white px-3 py-2 text-sm text-slate-900 transition-[border-color,box-shadow] focus:border-teal-600 focus:outline-none focus:shadow-[inset_0_-2px_0_#1746d1]"
        placeholder="you@shop.com"
      />
      @if (isInvalid(loginForm.email())) {
        <p id="email-error" class="mt-1 text-xs text-red-600">
          Enter a valid email address.
        </p>
      }
    </div>

    <div class="mb-6">
      <label
        for="password"
        class="mb-1.5 block text-sm font-medium text-slate-700"
      >
        Password
      </label>
      <input
        id="password"
        type="password"
        [formField]="loginForm.password"
        autocomplete="current-password"
        [attr.aria-invalid]="isInvalid(loginForm.password())"
        [attr.aria-describedby]="
          isInvalid(loginForm.password()) ? 'password-error' : null
        "
        class="min-h-11 w-full rounded-sm border border-slate-400 bg-white px-3 py-2 text-sm text-slate-900 transition-[border-color,box-shadow] focus:border-teal-600 focus:outline-none focus:shadow-[inset_0_-2px_0_#1746d1]"
        placeholder="••••••••"
      />
      @if (isInvalid(loginForm.password())) {
        <p id="password-error" class="mt-1 text-xs text-red-600">
          Password must be at least 6 characters.
        </p>
      }
    </div>

    <div class="mb-6 flex items-center justify-between">
      <label class="flex items-center gap-2 text-sm text-slate-600">
        <input
          type="checkbox"
          [formField]="loginForm.rememberMe"
          class="h-4 w-4 rounded border-slate-300 text-teal-600 focus:ring-teal-500"
        />
        Remember me
      </label>
      <a
        routerLink="/forgot-password"
        class="text-sm font-medium text-teal-700 hover:text-teal-800"
      >
        Forgot password?
      </a>
    </div>

    <button
      type="submit"
      [disabled]="loading()"
      class="flex min-h-11 w-full items-center justify-center rounded-sm border border-teal-600 bg-teal-600 px-4 py-2.5 text-sm font-semibold text-white transition-[background-color,border-color,transform] hover:border-slate-950 hover:bg-slate-950 disabled:cursor-not-allowed disabled:opacity-60 active:scale-[0.97]"
    >
      {{ loading() ? 'Signing in…' : 'Sign in' }}
    </button>
  </form>
</app-auth-layout>
