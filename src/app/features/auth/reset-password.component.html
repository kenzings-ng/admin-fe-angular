<div class="flex min-h-screen items-center justify-center bg-slate-50 px-4">
  <div class="w-full max-w-md">
    <div class="mb-8 text-center">
      <h1 class="text-2xl font-semibold tracking-tight text-slate-900">
        Reset password
      </h1>
      <p class="mt-1 text-sm text-slate-500">Choose a new password.</p>
    </div>

    @if (!token) {
      <div class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm sm:p-8">
        <div
          class="mb-3 grid h-10 w-10 place-items-center rounded-full bg-red-50 text-red-600"
          aria-hidden="true"
        >
          !
        </div>
        <h2 class="text-base font-semibold text-slate-900">Invalid link</h2>
        <p class="mt-1 text-sm text-slate-600">
          This reset link is missing its token. Please request a new one.
        </p>
        <a
          routerLink="/forgot-password"
          class="mt-5 inline-block text-sm font-medium text-teal-700 hover:text-teal-800"
        >
          Request a new link →
        </a>
      </div>
    } @else if (done()) {
      <div class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm sm:p-8">
        <div
          class="mb-3 grid h-10 w-10 place-items-center rounded-full bg-emerald-50 text-emerald-600"
          aria-hidden="true"
        >
          ✓
        </div>
        <h2 class="text-base font-semibold text-slate-900">Password updated</h2>
        <p class="mt-1 text-sm text-slate-600">
          Your password has been reset. You can now sign in.
        </p>
        <a
          routerLink="/login"
          class="mt-5 inline-block text-sm font-medium text-teal-700 hover:text-teal-800"
        >
          Go to sign in →
        </a>
      </div>
    } @else {
      <form
        (submit)="$event.preventDefault(); submit()"
        class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm sm:p-8"
        novalidate
      >
        <app-form-field
          label="New password"
          for="rp-password"
          class="mb-4"
          [required]="true"
          [error]="isInvalid(rform.password()) ? 'At least 6 characters.' : null"
        >
          <input
            id="rp-password"
            type="password"
            autocomplete="new-password"
            appInput
            [formField]="rform.password"
          />
        </app-form-field>

        <app-form-field
          label="Confirm new password"
          for="rp-confirm"
          class="mb-6"
          [required]="true"
          [error]="isInvalid(rform.confirm()) ? 'Please confirm the password.' : null"
        >
          <input
            id="rp-confirm"
            type="password"
            autocomplete="new-password"
            appInput
            [formField]="rform.confirm"
          />
        </app-form-field>

        <button
          app-button
          variant="primary"
          type="submit"
          [disabled]="loading()"
          class="w-full"
        >
          {{ loading() ? 'Updating…' : 'Reset password' }}
        </button>

        <a
          routerLink="/login"
          class="mt-4 block text-center text-sm font-medium text-slate-500 hover:text-slate-700"
        >
          ← Back to sign in
        </a>
      </form>
    }
  </div>
</div>
