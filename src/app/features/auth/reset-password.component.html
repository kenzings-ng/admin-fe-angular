<app-auth-layout title="Reset password" subtitle="Choose a new password.">
  @if (!token) {
    <div class="rounded-sm border border-slate-300 bg-white p-6 sm:p-8">
      <div
        class="mb-3 grid h-10 w-10 place-items-center rounded-full bg-red-50 text-red-600"
        aria-hidden="true"
      >
        <app-icon name="exclamation-circle" class="h-5 w-5" />
      </div>
      <h2 class="text-base font-semibold text-slate-900">Invalid link</h2>
      <p class="mt-1 text-sm text-slate-600">
        This reset link is missing its token. Please request a new one.
      </p>
      <a
        routerLink="/forgot-password"
        class="mt-5 inline-flex items-center gap-1 text-sm font-medium text-teal-700 hover:text-teal-800"
      >
        Request a new link
        <app-icon name="chevron-right" class="h-4 w-4" />
      </a>
    </div>
  } @else if (done()) {
    <div class="rounded-sm border border-slate-300 bg-white p-6 sm:p-8">
      <div
        class="mb-3 grid h-10 w-10 place-items-center rounded-full bg-emerald-50 text-emerald-600"
        aria-hidden="true"
      >
        <app-icon name="check-circle" class="h-5 w-5" />
      </div>
      <h2 class="text-base font-semibold text-slate-900">Password updated</h2>
      <p class="mt-1 text-sm text-slate-600">
        Your password has been reset. You can now sign in.
      </p>
      <a
        routerLink="/login"
        class="mt-5 inline-flex items-center gap-1 text-sm font-medium text-teal-700 hover:text-teal-800"
      >
        Go to sign in
        <app-icon name="chevron-right" class="h-4 w-4" />
      </a>
    </div>
  } @else {
    <form
      (submit)="$event.preventDefault(); submit()"
      class="rounded-sm border border-slate-300 bg-white p-6 sm:p-8"
      novalidate
    >
      <app-form-field
        label="New password"
        for="rp-password"
        class="mb-4"
        [required]="true"
        [error]="isInvalid(rform.password()) ? 'At least 6 characters.' : null"
      >
        <input
          id="rp-password"
          type="password"
          autocomplete="new-password"
          appInput
          [formField]="rform.password"
        />
      </app-form-field>

      <app-form-field
        label="Confirm new password"
        for="rp-confirm"
        class="mb-6"
        [required]="true"
        [error]="isInvalid(rform.confirm()) ? 'Please confirm the password.' : null"
      >
        <input
          id="rp-confirm"
          type="password"
          autocomplete="new-password"
          appInput
          [formField]="rform.confirm"
        />
      </app-form-field>

      <button
        app-button
        variant="primary"
        type="submit"
        [disabled]="loading()"
        class="w-full"
      >
        {{ loading() ? 'Updating…' : 'Reset password' }}
      </button>

      <a
        routerLink="/login"
        class="mt-4 flex items-center justify-center gap-1 text-sm font-medium text-slate-500 hover:text-slate-700"
      >
        <app-icon name="chevron-left" class="h-4 w-4" />
        Back to sign in
      </a>
    </form>
  }
</app-auth-layout>
