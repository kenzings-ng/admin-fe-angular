<div class="flex min-h-screen items-center justify-center bg-slate-50 px-4">
  <div class="w-full max-w-md">
    <div class="mb-8 text-center">
      <h1 class="text-2xl font-semibold tracking-tight text-slate-900">
        Forgot password
      </h1>
      <p class="mt-1 text-sm text-slate-500">
        Enter your email and we'll send you a reset link.
      </p>
    </div>

    @if (sent()) {
      <div class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm sm:p-8">
        <div
          class="mb-3 grid h-10 w-10 place-items-center rounded-full bg-emerald-50 text-emerald-600"
          aria-hidden="true"
        >
          ✓
        </div>
        <h2 class="text-base font-semibold text-slate-900">Check your inbox</h2>
        <p class="mt-1 text-sm text-slate-600">{{ message() }}</p>
        <a
          routerLink="/login"
          class="mt-5 inline-block text-sm font-medium text-teal-700 hover:text-teal-800"
        >
          ← Back to sign in
        </a>
      </div>
    } @else {
      <form
        (submit)="$event.preventDefault(); submit()"
        class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm sm:p-8"
        novalidate
      >
        <app-form-field
          label="Email"
          for="fp-email"
          class="mb-6"
          [required]="true"
          [error]="isInvalid(fform.email()) ? 'Enter a valid email address.' : null"
        >
          <input
            id="fp-email"
            type="email"
            autocomplete="email"
            appInput
            [formField]="fform.email"
            placeholder="you@shop.com"
          />
        </app-form-field>

        <button
          app-button
          variant="primary"
          type="submit"
          [disabled]="loading()"
          class="w-full"
        >
          {{ loading() ? 'Sending…' : 'Send reset link' }}
        </button>

        <a
          routerLink="/login"
          class="mt-4 block text-center text-sm font-medium text-slate-500 hover:text-slate-700"
        >
          ← Back to sign in
        </a>
      </form>
    }
  </div>
</div>
