<app-auth-layout
  title="Forgot password"
  subtitle="Enter your email and we'll send you a reset link."
>
  @if (sent()) {
    <div class="rounded-sm border border-slate-300 bg-white p-6 sm:p-8">
      <div
        class="mb-3 grid h-10 w-10 place-items-center rounded-full bg-emerald-50 text-emerald-600"
        aria-hidden="true"
      >
        <app-icon name="check-circle" class="h-5 w-5" />
      </div>
      <h2 class="text-base font-semibold text-slate-900">Check your inbox</h2>
      <p class="mt-1 text-sm text-slate-600">{{ message() }}</p>
      <a
        routerLink="/login"
        class="mt-5 inline-flex items-center gap-1 text-sm font-medium text-teal-700 hover:text-teal-800"
      >
        <app-icon name="chevron-left" class="h-4 w-4" />
        Back to sign in
      </a>
    </div>
  } @else {
    <form
      (submit)="$event.preventDefault(); submit()"
      class="rounded-sm border border-slate-300 bg-white p-6 sm:p-8"
      novalidate
    >
      <app-form-field
        label="Email"
        for="fp-email"
        class="mb-6"
        [required]="true"
        [error]="isInvalid(fform.email()) ? 'Enter a valid email address.' : null"
      >
        <input
          id="fp-email"
          type="email"
          autocomplete="email"
          appInput
          [formField]="fform.email"
          placeholder="you@shop.com"
        />
      </app-form-field>

      <button
        app-button
        variant="primary"
        type="submit"
        [disabled]="loading()"
        class="w-full"
      >
        {{ loading() ? 'Sending…' : 'Send reset link' }}
      </button>

      <a
        routerLink="/login"
        class="mt-4 flex items-center justify-center gap-1 text-sm font-medium text-slate-500 hover:text-slate-700"
      >
        <app-icon name="chevron-left" class="h-4 w-4" />
        Back to sign in
      </a>
    </form>
  }
</app-auth-layout>
