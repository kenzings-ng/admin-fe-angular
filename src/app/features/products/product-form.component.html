<app-modal
  [title]="editing() ? 'Edit product' : 'New product'"
  (dismiss)="cancel.emit()"
>
  <form (submit)="$event.preventDefault(); submit()" class="p-6" novalidate>
    <app-form-field
      label="Name"
      for="pf-name"
      class="mb-4"
      [required]="true"
      [error]="isInvalid(pform.name()) ? 'Name is required.' : null"
    >
      <input
        id="pf-name"
        type="text"
        appInput
        [formField]="pform.name"
        [attr.aria-invalid]="isInvalid(pform.name())"
      />
    </app-form-field>

    <div class="mb-4 grid grid-cols-1 gap-4 sm:grid-cols-2">
      <app-form-field
        label="Price (USD)"
        for="pf-price"
        [required]="true"
        [error]="isInvalid(pform.price()) ? 'Enter a price of 0 or more.' : null"
      >
        <input
          id="pf-price"
          type="number"
          step="0.01"
          appInput
          [formField]="pform.price"
          [attr.aria-invalid]="isInvalid(pform.price())"
        />
      </app-form-field>
      <app-form-field
        label="Stock"
        for="pf-stock"
        [error]="isInvalid(pform.stock()) ? 'Stock cannot be negative.' : null"
      >
        <input
          id="pf-stock"
          type="number"
          step="1"
          appInput
          [formField]="pform.stock"
          [attr.aria-invalid]="isInvalid(pform.stock())"
        />
      </app-form-field>
    </div>

    <div class="mb-4">
      <span class="mb-1.5 block text-sm font-medium text-slate-700">
        Image
      </span>

      <div class="flex items-start gap-4">
        <!-- Preview -->
        <div
          class="grid h-20 w-20 shrink-0 place-items-center overflow-hidden rounded-lg border border-slate-200 bg-slate-50"
        >
          @if (imageUrl()) {
            <img
              [src]="imageUrl()"
              alt="Product image preview"
              class="h-full w-full object-cover"
            />
          } @else {
            <span class="text-xs text-slate-400" aria-hidden="true">
              No image
            </span>
          }
        </div>

        <div class="min-w-0 flex-1">
          <input
            #fileInput
            id="pf-file"
            type="file"
            accept="image/jpeg,image/png,image/gif,image/webp"
            class="hidden"
            (change)="onFileSelected($event)"
            aria-describedby="pf-file-hint"
          />
          <div class="flex flex-wrap items-center gap-2">
            <button
              app-button
              variant="secondary"
              size="sm"
              [disabled]="uploading()"
              (click)="fileInput.click()"
            >
              {{
                uploading()
                  ? 'Uploading…'
                  : imageUrl()
                    ? 'Replace image'
                    : 'Upload image'
              }}
            </button>
            @if (imageUrl() && !uploading()) {
              <button
                app-button
                variant="danger-ghost"
                size="sm"
                (click)="clearImage()"
              >
                Remove
              </button>
            }
          </div>
          <p id="pf-file-hint" class="mt-1.5 text-xs text-slate-400">
            JPEG, PNG, GIF or WebP · up to 5 MB.
          </p>
        </div>
      </div>
    </div>

    <app-form-field label="Description" for="pf-desc" class="mb-6">
      <app-rich-text-editor id="pf-desc" [formField]="pform.description" />
    </app-form-field>

    <app-form-field label="Details &amp; care" for="pf-details" class="mb-6">
      <app-string-list-input
        id="pf-details"
        [formField]="pform.details"
        placeholder="e.g. 100% organic cotton"
      />
    </app-form-field>

    <app-form-field label="Sizes" for="pf-sizes" class="mb-6">
      <app-string-list-input
        id="pf-sizes"
        [formField]="pform.sizes"
        placeholder="e.g. S, M, L, XL"
      />
    </app-form-field>

    <div class="flex justify-end gap-3">
      <button app-button variant="secondary" (click)="cancel.emit()">
        Cancel
      </button>
      <button
        app-button
        variant="primary"
        type="submit"
        [disabled]="saving() || uploading()"
      >
        {{ saving() ? 'Saving…' : editing() ? 'Save changes' : 'Create product' }}
      </button>
    </div>
  </form>
</app-modal>
