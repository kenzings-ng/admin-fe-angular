<div class="h-full bg-white p-5">
  <div class="flex items-start justify-between gap-3">
    <div class="min-w-0">
      <p class="font-mono text-[9px] font-medium uppercase tracking-[0.14em] text-slate-500">{{ kpi().label }}</p>
      <p
        class="mt-3 text-3xl font-semibold tracking-[-0.04em] text-slate-950 tabular-nums"
      >
        {{ value() }}
      </p>
    </div>
    <span
      class="inline-flex shrink-0 items-center gap-1 px-2 py-1 text-xs font-semibold tabular-nums"
      [class]="
        up()
          ? 'bg-emerald-50 text-emerald-700'
          : 'bg-red-50 text-red-700'
      "
    >
      <app-icon [name]="up() ? 'arrow-up' : 'arrow-down'" class="h-3 w-3" />
      {{ deltaLabel() }}
    </span>
  </div>

  <p class="mt-5 border-t border-slate-200 pt-3 font-mono text-[9px] uppercase tracking-[0.1em] text-slate-400" aria-hidden="true">Compared with previous period</p>
  <p class="sr-only">
    {{ kpi().label }} is {{ value() }}, {{ up() ? 'up' : 'down' }}
    {{ deltaLabel() }} versus the previous period.
  </p>
</div>
