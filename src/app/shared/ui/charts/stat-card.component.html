<div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
  <div class="flex items-start justify-between gap-3">
    <div class="min-w-0">
      <p class="text-sm font-medium text-slate-500">{{ kpi().label }}</p>
      <p
        class="mt-1 text-2xl font-semibold tracking-tight text-slate-900 tabular-nums"
      >
        {{ value() }}
      </p>
    </div>
    <span
      class="inline-flex shrink-0 items-center gap-1 rounded-full px-2 py-0.5 text-xs font-semibold tabular-nums"
      [class]="
        up()
          ? 'bg-emerald-50 text-emerald-700'
          : 'bg-red-50 text-red-700'
      "
    >
      <span aria-hidden="true">{{ up() ? '▲' : '▼' }}</span>
      {{ deltaLabel() }}
    </span>
  </div>

  <svg
    class="mt-4 h-10 w-full"
    [attr.viewBox]="'0 0 ' + sparkW + ' ' + sparkH"
    preserveAspectRatio="none"
    aria-hidden="true"
    focusable="false"
  >
    <path
      [attr.d]="spark().area"
      [attr.fill]="up() ? 'rgba(13,148,136,0.12)' : 'rgba(220,38,38,0.12)'"
    />
    <path
      [attr.d]="spark().line"
      fill="none"
      [attr.stroke]="up() ? '#0d9488' : '#dc2626'"
      stroke-width="2"
      stroke-linejoin="round"
      stroke-linecap="round"
      vector-effect="non-scaling-stroke"
    />
  </svg>

  <p class="sr-only">
    {{ kpi().label }} is {{ value() }}, {{ up() ? 'up' : 'down' }}
    {{ deltaLabel() }} versus the previous period.
  </p>
</div>
