<div
  class="rounded-2xl border border-slate-200/80 bg-white p-5 shadow-[0_12px_36px_-24px_rgba(15,23,42,0.35)] transition-all hover:-translate-y-0.5 hover:shadow-lg"
>
  <div class="flex items-start justify-between gap-3">
    <div class="min-w-0">
      <p class="text-xs font-semibold uppercase tracking-[0.12em] text-slate-400">{{ kpi().label }}</p>
      <p
        class="mt-2 text-3xl font-semibold tracking-[-0.04em] text-slate-950 tabular-nums"
      >
        {{ value() }}
      </p>
    </div>
    <span
      class="inline-flex shrink-0 items-center gap-1 rounded-full px-2.5 py-1 text-xs font-semibold tabular-nums"
      [class]="
        up()
          ? 'bg-emerald-50 text-emerald-700'
          : 'bg-red-50 text-red-700'
      "
    >
      <app-icon [name]="up() ? 'arrow-up' : 'arrow-down'" class="h-3 w-3" />
      {{ deltaLabel() }}
    </span>
  </div>

  <svg
    class="mt-4 h-10 w-full"
    [attr.viewBox]="'0 0 ' + sparkW + ' ' + sparkH"
    preserveAspectRatio="none"
    aria-hidden="true"
    focusable="false"
  >
    <path
      [attr.d]="spark().area"
      [attr.fill]="up() ? 'rgba(13,148,136,0.12)' : 'rgba(220,38,38,0.12)'"
    />
    <path
      [attr.d]="spark().line"
      fill="none"
      [attr.stroke]="up() ? '#0d9488' : '#dc2626'"
      stroke-width="2"
      stroke-linejoin="round"
      stroke-linecap="round"
      vector-effect="non-scaling-stroke"
    />
  </svg>

  <p class="sr-only">
    {{ kpi().label }} is {{ value() }}, {{ up() ? 'up' : 'down' }}
    {{ deltaLabel() }} versus the previous period.
  </p>
</div>
