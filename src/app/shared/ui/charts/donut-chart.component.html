<div class="flex flex-col items-center gap-5 sm:flex-row sm:items-center sm:gap-6">
  <div class="relative shrink-0">
    <svg
      width="180"
      height="180"
      viewBox="0 0 180 180"
      role="img"
      [attr.aria-label]="'Breakdown by ' + unit()"
    >
      <circle
        cx="90"
        cy="90"
        r="64"
        fill="none"
        stroke="#f1f5f9"
        stroke-width="22"
      />
      @for (arc of arcs(); track arc.label) {
        <circle
          cx="90"
          cy="90"
          r="64"
          fill="none"
          [attr.stroke]="arc.color"
          stroke-width="22"
          pathLength="100"
          [attr.stroke-dasharray]="arc.dash + ' ' + (100 - arc.dash)"
          [attr.stroke-dashoffset]="arc.offset"
          stroke-linecap="butt"
        />
      }
    </svg>
    <div
      class="pointer-events-none absolute inset-0 flex flex-col items-center justify-center"
    >
      <span class="text-2xl font-semibold tracking-tight text-slate-900 tabular-nums">
        {{ totalDisplay() }}
      </span>
      <span class="text-xs font-medium text-slate-500">{{ unit() }}</span>
    </div>
  </div>

  <ul class="flex-1 space-y-2.5">
    @for (arc of arcs(); track arc.label) {
      <li class="flex items-center gap-2.5 text-sm">
        <span
          class="h-2.5 w-2.5 shrink-0 rounded-full"
          [style.background-color]="arc.color"
          aria-hidden="true"
        ></span>
        <span class="flex-1 capitalize text-slate-600">{{ arc.label }}</span>
        <span class="font-semibold text-slate-900 tabular-nums">
          {{ arc.value }}
        </span>
        <span class="w-10 text-right text-slate-400 tabular-nums">
          {{ arc.pct }}
        </span>
      </li>
    }
  </ul>
</div>
