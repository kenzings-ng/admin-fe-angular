<div
  class="pointer-events-none fixed inset-x-0 top-4 z-50 flex flex-col items-center gap-2 px-4"
  aria-live="polite"
  aria-atomic="true"
>
  @for (toast of toasts(); track toast.id) {
    <div
      role="status"
      class="toast-enter pointer-events-auto flex w-full max-w-sm items-start gap-3 rounded-sm border px-4 py-3 shadow-lg"
      [class]="styles[toast.kind]"
    >
      <app-icon
        [name]="icons[toast.kind]"
        class="mt-0.5 h-5 w-5 shrink-0"
        [class]="iconStyles[toast.kind]"
      />
      <p class="flex-1 text-sm leading-snug">{{ toast.message }}</p>
      <button
        type="button"
        class="flex h-11 w-11 items-center justify-center opacity-70 hover:opacity-100"
        (click)="toastService.dismiss(toast.id)"
        aria-label="Dismiss notification"
      >
        <app-icon name="x" class="h-4 w-4" />
      </button>
    </div>
  }
</div>
