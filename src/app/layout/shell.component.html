<div class="flex min-h-screen bg-slate-50 text-slate-900">
  <!-- Sidebar -->
  <aside
    class="fixed inset-y-0 left-0 z-30 w-64 -translate-x-full border-r border-slate-200 bg-white transition-transform lg:translate-x-0"
    [class.translate-x-0]="sidebarOpen()"
  >
    <div class="flex h-16 items-center gap-2 border-b border-slate-200 px-6">
      <span
        class="grid h-8 w-8 place-items-center rounded-lg bg-teal-600 text-sm font-bold text-white"
        aria-hidden="true"
      >
        S
      </span>
      <span class="text-base font-semibold tracking-tight">ShopAdmin</span>
    </div>
    <nav class="flex flex-col gap-1 p-4" aria-label="Main">
      @for (item of navItems; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="bg-teal-50 text-teal-700"
          [routerLinkActiveOptions]="{ exact: false }"
          (click)="closeSidebar()"
          class="flex items-center gap-3 rounded-lg px-3 py-2 text-sm font-medium text-slate-600 transition-colors hover:bg-slate-100 hover:text-slate-900 focus:outline-none focus-visible:ring-2 focus-visible:ring-teal-500"
        >
          <span class="text-base" aria-hidden="true">{{ item.icon }}</span>
          {{ item.label }}
        </a>
      }
    </nav>
  </aside>

  <!-- Backdrop for mobile -->
  @if (sidebarOpen()) {
    <button
      type="button"
      class="fixed inset-0 z-20 bg-slate-900/40 lg:hidden"
      (click)="closeSidebar()"
      aria-label="Close navigation menu"
    ></button>
  }

  <!-- Main column -->
  <div class="flex min-w-0 flex-1 flex-col lg:pl-64">
    <header
      class="sticky top-0 z-10 flex h-16 items-center gap-4 border-b border-slate-200 bg-white/80 px-4 backdrop-blur sm:px-6"
    >
      <button
        type="button"
        class="rounded-lg p-2 text-slate-600 hover:bg-slate-100 focus:outline-none focus-visible:ring-2 focus-visible:ring-teal-500 lg:hidden"
        (click)="toggleSidebar()"
        [attr.aria-expanded]="sidebarOpen()"
        aria-label="Toggle navigation menu"
      >
        <span class="text-lg" aria-hidden="true">☰</span>
      </button>

      <div class="ml-auto flex items-center gap-3">
        <div class="hidden text-right sm:block">
          <p class="text-sm font-medium leading-tight">
            {{ auth.user()?.name }}
          </p>
          <p class="text-xs capitalize text-slate-500">
            {{ auth.user()?.role }}
          </p>
        </div>
        <span
          class="grid h-9 w-9 place-items-center rounded-full bg-slate-200 text-sm font-semibold text-slate-700"
          aria-hidden="true"
        >
          {{ initials() }}
        </span>
        <button
          type="button"
          class="rounded-lg border border-slate-200 px-3 py-1.5 text-sm font-medium text-slate-700 transition-colors hover:bg-slate-100 focus:outline-none focus-visible:ring-2 focus-visible:ring-teal-500"
          (click)="auth.logout()"
        >
          Sign out
        </button>
      </div>
    </header>

    <main class="flex-1 p-4 sm:p-6 lg:p-8">
      <router-outlet />
    </main>
  </div>
</div>
