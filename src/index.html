<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>MAISON Operations</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1019">
  <meta name="maison-design-seed" content="8e5a38fd">
  <script>
    (() => {
      const root = document.documentElement;
      let mode = 'system';

      try {
        const stored = localStorage.getItem('shop-admin-theme');
        if (stored === 'light' || stored === 'dark' || stored === 'system') mode = stored;
      } catch {
        // Storage can be unavailable in hardened browser contexts; system mode remains safe.
      }

      const dark = mode === 'dark' || (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
      root.classList.toggle('dark', dark);
      root.dataset.theme = dark ? 'dark' : 'light';
      document.querySelector('meta[name="theme-color"]')?.setAttribute('content', dark ? '#0b1019' : '#f4f1e9');
    })();
  </script>
  <style>
    :root {
      color-scheme: light;
      --boot-canvas: #f4f1e9;
      --boot-ink: #121722;
      --boot-muted: #606671;
      --boot-line: #d5d1c8;
      --boot-accent: #1746d1;
      --boot-grid: rgba(18, 23, 34, 0.045);
    }

    html.dark {
      color-scheme: dark;
      --boot-canvas: #0b1019;
      --boot-ink: #f5f7fa;
      --boot-muted: #9da6b2;
      --boot-line: #303846;
      --boot-accent: #2d5de0;
      --boot-grid: rgba(237, 240, 245, 0.035);
    }

    html,
    body {
      min-width: 320px;
      min-height: 100%;
      margin: 0;
      background: var(--boot-canvas);
    }

    .maison-boot {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: var(--boot-ink);
      background-color: var(--boot-canvas);
      background-image: linear-gradient(90deg, transparent 0 63px, var(--boot-grid) 64px);
      background-size: 64px 100%;
      font-family: Arial, sans-serif;
    }

    .maison-boot__content {
      width: min(296px, calc(100vw - 48px));
    }

    .maison-boot__brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .maison-boot__mark {
      width: 44px;
      height: 44px;
      flex: none;
    }

    .maison-boot__piece { fill: currentColor; }
    .maison-boot__seam,
    .maison-boot__notch {
      fill: none;
      stroke: currentColor;
      stroke-linecap: square;
      stroke-linejoin: miter;
    }
    .maison-boot__seam { stroke-width: 1.5; opacity: 0.46; }
    .maison-boot__notch { stroke: #c84435; stroke-width: 2.5; }

    .maison-boot__copy { display: grid; line-height: 1; }
    .maison-boot__word { font-size: 18px; font-weight: 700; letter-spacing: 0.18em; }
    .maison-boot__division { margin-top: 6px; color: var(--boot-muted); font-size: 9px; font-weight: 700; letter-spacing: 0.2em; }

    .maison-boot__status {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 30px;
      color: var(--boot-muted);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.16em;
    }

    .maison-boot__signal {
      width: 7px;
      height: 7px;
      background: var(--boot-accent);
    }

    .maison-boot__rail {
      position: relative;
      height: 2px;
      margin-top: 12px;
      overflow: hidden;
      background: var(--boot-line);
    }

    .maison-boot__rail::after {
      position: absolute;
      inset: 0;
      content: '';
      background: var(--boot-accent);
      transform: translateX(-100%);
      animation: maison-boot-progress 1.1s cubic-bezier(0.23, 1, 0.32, 1) infinite;
    }

    .maison-boot[data-state='ready'] { animation: maison-boot-out 180ms cubic-bezier(0.23, 1, 0.32, 1) forwards; }
    .maison-boot[data-state='error'] .maison-boot__signal,
    .maison-boot[data-state='error'] .maison-boot__rail::after { background: #c84435; }
    .maison-boot[data-state='error'] .maison-boot__rail::after { animation: none; transform: none; }

    @keyframes maison-boot-progress {
      0% { transform: translateX(-100%); }
      55%, 100% { transform: translateX(100%); }
    }

    @keyframes maison-boot-out {
      to { opacity: 0; transform: translateY(-4px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .maison-boot__rail::after { animation: none; transform: none; }
      .maison-boot[data-state='ready'] { animation-duration: 0.01ms; transform: none; }
    }
  </style>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>
  <div id="maison-boot" class="maison-boot" role="status" aria-live="polite" aria-label="Preparing MAISON Operations">
    <div class="maison-boot__content">
      <div class="maison-boot__brand" aria-hidden="true">
        <svg class="maison-boot__mark" viewBox="0 0 48 48">
          <path class="maison-boot__piece" d="M4 42V7h10l10 15 10-15h10v35H33V24l-9 13-9-13v18H4Z"></path>
          <path class="maison-boot__seam" d="M24 22v15M14 7l10 15L34 7"></path>
          <path class="maison-boot__notch" d="m20 4 4 4 4-4"></path>
        </svg>
        <span class="maison-boot__copy">
          <span class="maison-boot__word">MAISON</span>
          <span class="maison-boot__division">OPERATIONS</span>
        </span>
      </div>
      <div class="maison-boot__status" aria-hidden="true">
        <span data-boot-message>PREPARING WORKSPACE</span>
        <span class="maison-boot__signal"></span>
      </div>
      <div class="maison-boot__rail" aria-hidden="true"></div>
    </div>
  </div>
  <app-root></app-root>
  <script src="env.js"></script>
</body>
</html>
